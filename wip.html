<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under construction — Jem Teraoka</title>
    <meta name="description" content="This case study is being finalized. Play a bit while you wait.">
    <meta name="robots" content="noindex">

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css?v=23">

    <style>
        body.wip-standalone {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
        }
        .wip-standalone-wrap {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
            text-align: center;
        }
        .wip-standalone-title {
            font-family: var(--font-display, 'Space Grotesk', sans-serif);
            font-size: clamp(1.4rem, 3.6vw, 1.9rem);
            font-weight: 600;
            margin: 0;
            color: var(--text);
            letter-spacing: -0.01em;
        }
        .wip-standalone-sub {
            font-size: 0.95rem;
            color: var(--text-muted);
            max-width: 460px;
            margin: 0;
            line-height: 1.5;
        }
        .wip-standalone-stage-wrap {
            width: 100%;
            max-width: 700px;
        }
        .wip-standalone-back {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 22px;
            border: 1px solid var(--border-hover, var(--border));
            border-radius: 999px;
            color: var(--text);
            text-decoration: none;
            font-family: var(--font-display, 'Space Grotesk', sans-serif);
            font-weight: 500;
            font-size: 0.92rem;
            background: transparent;
            transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }
        .wip-standalone-back:hover {
            transform: translateY(-2px);
            background: var(--text);
            color: var(--bg);
            border-color: var(--text);
        }
        .wip-standalone-hint {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin: 0;
            opacity: 0.8;
        }
    </style>
</head>
<body data-theme="light" class="wip-standalone">

    <div class="cursor-dot" id="cursorDot"></div>
    <div class="cursor-ring" id="cursorRing"><span class="cursor-text">view</span></div>

    <main class="wip-standalone-wrap">
        <h1 class="wip-standalone-title">🚧 I'm finalizing this case study</h1>
        <p class="wip-standalone-sub">Play a bit while you wait ↓</p>

        <div class="wip-standalone-stage-wrap">
            <div class="wip-stage">
                <div class="wip-score">
                    <span>HI <em id="wipHi">00000</em></span>
                    <span class="wip-cur" id="wipCur">00000</span>
                </div>
                <canvas class="wip-canvas" id="wipCanvas" width="700" height="200" tabindex="0" aria-label="Dino runner game"></canvas>
                <div class="wip-overlay" id="wipOverlay">
                    <p class="wip-overlay-title">Press <kbd>SPACE</kbd> or click to start</p>
                </div>
            </div>
        </div>

        <p class="wip-standalone-hint">SPACE / ↑ / tap to jump</p>

        <a href="/" class="wip-standalone-back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Back to home
        </a>
    </main>

    <script src="js/wip-game.js?v=3"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('wipCanvas');
            const scoreEl = document.getElementById('wipCur');
            const hiEl = document.getElementById('wipHi');
            const overlayEl = document.getElementById('wipOverlay');
            if (window.WipGame) {
                window.WipGame.mount(canvas, scoreEl, hiEl, overlayEl);
            }

            // Cursor (smooth follow, no bounce) — desktop only
            const dot = document.getElementById('cursorDot');
            const ring = document.getElementById('cursorRing');
            const isTouch = window.matchMedia('(pointer: coarse)').matches;
            if (!isTouch && dot && ring) {
                let mx = -200, my = -200, entered = false;
                const dotS = { x: -200, y: -200 };
                const ringS = { x: -200, y: -200 };
                const DOT_LERP = 0.35, RING_LERP = 0.18;

                document.addEventListener('mousemove', (e) => {
                    mx = e.clientX; my = e.clientY;
                    if (!entered) {
                        entered = true;
                        dotS.x = mx; dotS.y = my;
                        ringS.x = mx; ringS.y = my;
                        dot.style.opacity = '1';
                        ring.style.opacity = '1';
                    }
                });
                document.addEventListener('mouseleave', () => {
                    dot.style.opacity = '0';
                    ring.style.opacity = '0';
                });
                document.addEventListener('mouseenter', () => {
                    if (entered) {
                        dot.style.opacity = '1';
                        ring.style.opacity = '1';
                    }
                });

                let targetScale = 1, hoverScale = 1;
                document.querySelectorAll('a, button, .wip-canvas').forEach(el => {
                    el.addEventListener('mouseenter', () => {
                        ring.classList.add('cursor-hover');
                        targetScale = 1.3;
                    });
                    el.addEventListener('mouseleave', () => {
                        ring.classList.remove('cursor-hover');
                        targetScale = 1;
                    });
                });

                function frame() {
                    requestAnimationFrame(frame);
                    if (!entered) return;
                    dotS.x += (mx - dotS.x) * DOT_LERP;
                    dotS.y += (my - dotS.y) * DOT_LERP;
                    ringS.x += (mx - ringS.x) * RING_LERP;
                    ringS.y += (my - ringS.y) * RING_LERP;
                    hoverScale += (targetScale - hoverScale) * 0.18;
                    const dotR = 4;
                    const ringR = ring.classList.contains('cursor-hover') ? 24 : 18;
                    dot.style.transform = `translate3d(${dotS.x - dotR}px, ${dotS.y - dotR}px, 0) scale(${hoverScale})`;
                    ring.style.transform = `translate3d(${ringS.x - ringR}px, ${ringS.y - ringR}px, 0) scale(${hoverScale})`;
                }
                frame();
            }
        });
    </script>

</body>
</html>
