<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cripto App — Jem Teraoka</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .case-page { padding-top: 6rem; }
        .case-header { max-width: 1200px; margin: 0 auto; padding: 2rem 2rem 3rem; }
        .case-back { font-size: 0.8rem; color: var(--text-muted); transition: color 0.3s; display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 2rem; cursor: none; }
        .case-back:hover { color: var(--text); }
        .case-page-title { font-family: 'Syne', sans-serif; font-size: clamp(2rem, 5vw, 4rem); font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.5rem; }
        .case-page-subtitle { font-size: 0.85rem; color: var(--text-secondary); letter-spacing: 0.05em; }
        .case-body { max-width: 900px; margin: 0 auto; padding: 0 2rem 6rem; }
        .case-body img { width: 100%; border-radius: 12px; border: 1px solid var(--border); }
    </style>
</head>
<body data-theme="light">
    <canvas class="glyph-canvas" id="glyphCanvas"></canvas>
    <div class="cursor-dot" id="cursorDot"></div>
    <div class="cursor-ring" id="cursorRing"><span class="cursor-text">view</span></div>

    <nav class="nav" id="nav">
        <a href="../" class="nav-logo magnetic">jem</a>
        <div class="nav-right">
            <a href="../#work" class="nav-link magnetic">trabalhos</a>
            <a href="../#about" class="nav-link magnetic">sobre</a>
            <a href="../#contact" class="nav-link magnetic">contato</a>
            <div class="nav-divider"></div>
            <button class="theme-toggle magnetic" id="themeToggle" aria-label="Toggle theme">
                <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
        </div>
    </nav>

    <div class="case-page">
        <div class="case-header">
            <a href="../#work" class="case-back magnetic">&larr; voltar</a>
            <h1 class="case-page-title">Cripto App</h1>
            <p class="case-page-subtitle">Case Study — UX/UI Design</p>
        </div>
        <div class="case-body">
            <img src="../assets/case-cripto-app.png" alt="Cripto App — Case Study" loading="lazy">
        </div>
    </div>

    <footer class="footer">
        <div class="container footer-inner">
            <span class="footer-copy">&copy; 2026 Jem Teraoka</span>
            <a href="../" class="footer-top magnetic">voltar ao inicio</a>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
        // Theme
        const saved = 'light';
        document.body.setAttribute('data-theme', saved);
        document.getElementById('themeToggle')?.addEventListener('click', () => {
            const next = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', next);
            localStorage.setItem('jem-theme', next);
        });
        // Nav scroll
        window.addEventListener('scroll', () => {
            document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 50);
        }, { passive: true });
        // Cursor
        const dot = document.getElementById('cursorDot');
        const ring = document.getElementById('cursorRing');
        const glow = document.getElementById('cursorGlow');
        if (!window.matchMedia('(pointer: coarse)').matches && dot && ring) {
            let mx=0,my=0,rx=0,ry=0,gx=0,gy=0;
            document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; dot.style.transform=`translate(${mx-4}px,${my-4}px)`; });
            (function loop() {
                rx+=(mx-rx)*0.12; ry+=(my-ry)*0.12;
                ring.style.transform=`translate(${rx-20}px,${ry-20}px)`;
                if(glow){ gx+=(mx-gx)*0.06; gy+=(my-gy)*0.06; glow.style.transform=`translate(${gx-200}px,${gy-200}px)`; }
                requestAnimationFrame(loop);
            })();
            document.querySelectorAll('a, button, .magnetic').forEach(el => {
                el.addEventListener('mouseenter', () => ring.classList.add('cursor-hover'));
                el.addEventListener('mouseleave', () => ring.classList.remove('cursor-hover'));
            });
        }
        // Animate in
        gsap.from('.case-page-title', { y: 40, opacity: 0, duration: 0.8, ease: 'power4.out', delay: 0.2 });
        gsap.from('.case-page-subtitle', { y: 20, opacity: 0, duration: 0.6, ease: 'power3.out', delay: 0.4 });
        gsap.from('.case-body img', { y: 40, opacity: 0, duration: 0.8, ease: 'power3.out', delay: 0.5 });
    </script>
</body>
</html>
