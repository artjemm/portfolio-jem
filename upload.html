<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload — Portfolio Jem</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #050505; color: #f0f0f0; min-height: 100vh; padding: 2rem; }
        .header { max-width: 800px; margin: 0 auto 2rem; }
        .header h1 { font-family: 'Syne', sans-serif; font-size: 2rem; margin-bottom: 0.5rem; }
        .header p { color: #777; font-size: 0.85rem; }
        .header a { color: #777; text-decoration: underline; font-size: 0.8rem; }

        .dropzone {
            max-width: 800px; margin: 0 auto 3rem;
            border: 2px dashed #2a2a2a; border-radius: 16px;
            padding: 4rem 2rem; text-align: center;
            transition: border-color 0.3s, background 0.3s;
            cursor: pointer;
        }
        .dropzone:hover, .dropzone.drag-over {
            border-color: #8b7cf6; background: rgba(139, 124, 246, 0.03);
        }
        .dropzone-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.3; }
        .dropzone-text { color: #777; font-size: 0.9rem; margin-bottom: 0.5rem; }
        .dropzone-hint { color: #444; font-size: 0.75rem; }
        .dropzone input { display: none; }

        .progress-wrap { max-width: 800px; margin: 0 auto 2rem; display: none; }
        .progress-bar { height: 3px; background: #1a1a1a; border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0; background: #8b7cf6; transition: width 0.3s; border-radius: 2px; }
        .progress-text { font-size: 0.75rem; color: #777; margin-top: 0.5rem; text-align: center; }

        .gallery { max-width: 800px; margin: 0 auto; }
        .gallery h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.15em; color: #777; margin-bottom: 1.5rem; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; }
        .gallery-item {
            position: relative; border-radius: 12px; overflow: hidden;
            border: 1px solid #1e1e1e; background: #0e0e0e;
            transition: border-color 0.3s;
        }
        .gallery-item:hover { border-color: #333; }
        .gallery-item img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
        .gallery-item-info { padding: 0.75rem; }
        .gallery-item-name { font-size: 0.75rem; color: #aaa; word-break: break-all; }
        .gallery-item-size { font-size: 0.65rem; color: #555; margin-top: 0.25rem; }
        .gallery-item-delete {
            position: absolute; top: 8px; right: 8px;
            width: 28px; height: 28px; border-radius: 50%;
            background: rgba(0,0,0,0.7); border: 1px solid #333;
            color: #999; font-size: 14px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.2s;
        }
        .gallery-item:hover .gallery-item-delete { opacity: 1; }
        .gallery-item-delete:hover { background: #dc2626; color: #fff; border-color: #dc2626; }

        .empty { text-align: center; color: #333; padding: 3rem; font-size: 0.85rem; }

        .toast {
            position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
            background: #161616; border: 1px solid #2a2a2a; border-radius: 8px;
            padding: 0.75rem 1.5rem; font-size: 0.8rem; color: #aaa;
            opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Upload de Assets</h1>
        <p>Arraste imagens ou PDFs aqui. PNG, JPG, WebP, SVG, PDF.</p>
        <a href="/portfolio/">← voltar pro portfolio</a>
    </div>

    <div class="dropzone" id="dropzone">
        <div class="dropzone-icon">+</div>
        <div class="dropzone-text">Arraste arquivos aqui ou clique para selecionar</div>
        <div class="dropzone-hint">PNG, JPG, WebP, SVG, PDF — max 32MB</div>
        <input type="file" id="fileInput" multiple accept="image/*,application/pdf">
    </div>

    <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">Enviando...</div>
    </div>

    <div class="gallery" id="gallery">
        <h2>Assets enviados</h2>
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const galleryGrid = document.getElementById('galleryGrid');
        const progressWrap = document.getElementById('progressWrap');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const toast = document.getElementById('toast');

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        // Drag & Drop
        ['dragenter', 'dragover'].forEach(e => {
            dropzone.addEventListener(e, (ev) => { ev.preventDefault(); dropzone.classList.add('drag-over'); });
        });
        ['dragleave', 'drop'].forEach(e => {
            dropzone.addEventListener(e, (ev) => { ev.preventDefault(); dropzone.classList.remove('drag-over'); });
        });
        dropzone.addEventListener('drop', (e) => uploadFiles(e.dataTransfer.files));
        dropzone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => uploadFiles(fileInput.files));

        async function uploadFiles(files) {
            const total = files.length;
            if (!total) return;
            progressWrap.style.display = 'block';
            let done = 0;

            for (const file of files) {
                progressText.textContent = `Enviando ${done + 1}/${total}: ${file.name}`;
                progressFill.style.width = ((done / total) * 100) + '%';

                const fd = new FormData();
                fd.append('file', file);
                try {
                    const res = await fetch('/portfolio/uploader/upload', { method: 'POST', body: fd });
                    const data = await res.json();
                    if (data.ok) {
                        done++;
                        showToast(`${file.name} enviado!`);
                    } else {
                        showToast(`Erro: ${data.error}`);
                    }
                } catch (err) {
                    showToast(`Falha: ${err.message}`);
                }
            }

            progressFill.style.width = '100%';
            progressText.textContent = `${done}/${total} enviados!`;
            setTimeout(() => { progressWrap.style.display = 'none'; progressFill.style.width = '0'; }, 2000);
            loadGallery();
        }

        async function loadGallery() {
            try {
                const res = await fetch('/portfolio/uploader/list');
                const files = await res.json();
                if (!files.length) {
                    galleryGrid.innerHTML = '<div class="empty">Nenhum asset ainda. Arraste imagens acima.</div>';
                    return;
                }
                galleryGrid.innerHTML = files.map(f => {
                    const isPdf = f.name.toLowerCase().endsWith('.pdf');
                    const preview = isPdf
                        ? `<div style="aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;color:#555;font-family:'Syne',sans-serif;font-size:1.5rem;background:#0a0a0a;">PDF</div>`
                        : `<img src="${f.path}" alt="${f.name}" loading="lazy">`;
                    return `
                    <div class="gallery-item">
                        ${preview}
                        <div class="gallery-item-info">
                            <div class="gallery-item-name">${f.name}</div>
                            <div class="gallery-item-size">${formatSize(f.size)}</div>
                        </div>
                        <button class="gallery-item-delete" onclick="deleteFile('${f.name}')" title="Deletar">&times;</button>
                    </div>
                    `;
                }).join('');
            } catch (err) {
                galleryGrid.innerHTML = '<div class="empty">Erro ao carregar assets.</div>';
            }
        }

        async function deleteFile(name) {
            if (!confirm(`Deletar ${name}?`)) return;
            await fetch('/portfolio/uploader/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });
            showToast(`${name} deletado`);
            loadGallery();
        }

        loadGallery();
    </script>
</body>
</html>
